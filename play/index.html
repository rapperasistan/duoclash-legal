<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Clash · Play</title>
<meta name="description" content="Play Duo Clash in your browser: pair with your person and play on a video call, from a laptop, an Android phone or with someone on the iPhone app.">
<meta property="og:title" content="Play Duo Clash in your browser">
<meta property="og:description" content="Games on a video call for the two of you. Laptop, Android or iPhone.">
<meta property="og:image" content="https://duoclash.app/assets/og.jpg">
<meta property="og:url" content="https://duoclash.app/play/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d0e12">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="play.css?v=1">
</head>
<body>
<div class="app" data-view="loading">
  <header class="bar">
    <a class="brand" href="../"><img src="../assets/icon-512.png" alt="">Duo Clash</a>
    <span class="tag">Web</span>
    <span class="grow"></span>
    <span class="me-chip" id="who"></span>
    <button class="round" id="more" hidden aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  </header>

  <aside id="call" hidden>
    <div class="tile them">
      <video data-remote autoplay playsinline></video>
      <span class="who"></span>
      <span class="note"></span>
      <span class="label"></span>
      <span class="mark"></span>
      <span class="badge" hidden></span>
    </div>
    <div class="tile you">
      <video data-local autoplay playsinline muted></video>
      <span class="who"></span>
      <span class="label"></span>
      <span class="mark"></span>
      <span class="badge" hidden></span>
    </div>
    <div class="controls">
      <button class="round" data-mic aria-label="Microphone"></button>
      <button class="round" data-cam aria-label="Camera"></button>
      <button class="round hang" data-hang aria-label="End call" hidden><svg class="i" viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><path d="M22 2 2 22"/></svg></button>
      <button class="pill-button" data-start hidden>Start video</button>
    </div>
  </aside>

  <main id="view">
    <div class="center"><div class="spinner"></div></div>
  </main>
</div>
<dialog id="menu"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../js/games.js?v=10"></script>
<script type="module" src="js/app.js?v=1"></script>
</body>
</html>
